# Configurazione "cotta" dentro il jar. Per riusare il launcher con un altro
# server basta cambiare questi valori e ricompilare.
launcher.name=LollataLauncher
# Cartella dati: %APPDATA%\<dir> su Windows, ~/.<dir> su Linux, ~/Library/Application Support/<dir> su macOS
launcher.dir=lollata-launcher
index.url=https://mcfiles.lollata.xyz/packs/index.json
# Login Microsoft (account premium): client id dell'app registrata su Azure (vedi README,
# "Account premium"). Lasciato vuoto, il launcher permette solo i nickname offline.
msa.clientId=
