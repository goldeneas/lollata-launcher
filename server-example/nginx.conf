# /etc/nginx/sites-available/mcfiles   (poi: ln -s in sites-enabled e `certbot --nginx` per HTTPS)
server {
    listen 80;
    server_name mcfiles.lollata.xyz;
    root /srv/mcfiles;
    autoindex off;

    # index.json e pack.json devono essere sempre freschi
    location ~ ^/packs/.*\.json$ {
        add_header Cache-Control "no-cache";
    }

    # gli oggetti sono immutabili (il nome è l'hash del contenuto)
    location /packs/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # qui puoi mettere launcher.jar da far scaricare agli amici
    location /launcher/ { }
}
