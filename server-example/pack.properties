# Da mettere nella cartella dell'istanza Prism, accanto a instance.cfg e mmc-pack.json.
# minecraft, loader e loaderVersion vengono letti da mmc-pack.json; qui puoi forzarli.
# id: nome della cartella sul web server e dell'istanza sul PC dell'amico.
# Se manca si usa il nome della cartella dell'istanza (minuscolo, spazi -> "-").
id=atm10a
name=All the Mods 10 Aeronautics
# Indirizzo del server Minecraft a cui collegarsi
server=mc.lollata.xyz:25565
# Accesso richiesto: premium (account Microsoft) | offline (basta un nickname) |
# auto (default: lo chiede al server Minecraft indicato in "server")
#authMode=auto
memoryMb=8192
#minecraft=1.21.1
#loader=neoforge        (neoforge | forge | fabric | quilt | vanilla)
#loaderVersion=21.1.228
#version=0.7.1
# Glob extra da escludere / da scrivere solo se mancanti (separati da virgola)
#exclude=shaderpacks/**
#once=config/jei/**
#jvmArgs=-XX:+UseG1GC
